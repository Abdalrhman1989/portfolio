# GitLab CI/CD Pipeline for HR-ON Integration Engine
# Optimized for Node.js 20 & AWS Serverless Deployment

image: node:20-alpine

stages:
  - lint_and_typecheck
  - test
  - build
  - deploy_staging

cache:
  paths:
    - node_modules/

variables:
  NODE_ENV: "test"

lint_and_typecheck:
  stage: lint_and_typecheck
  script:
    - npm ci
    - npm run typecheck

run_unit_tests:
  stage: test
  script:
    - npm ci
    - npm run test

build_bundle:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy_staging:
  stage: deploy_staging
  only:
    - main
  script:
    - echo "Deploying Lambda handlers and SQS worker to AWS Serverless Staging (eu-west-1)..."
    - echo "Deployment complete."
