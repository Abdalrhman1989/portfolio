name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'projects/hr-on-integration-engine/package.json'
      - name: Install dependencies
        working-directory: projects/hr-on-integration-engine
        run: npm install
      - name: Typecheck
        working-directory: projects/hr-on-integration-engine
        run: npm run typecheck
      - name: Run Tests
        working-directory: projects/hr-on-integration-engine
        run: npm test
      - name: Build Production Bundle
        working-directory: projects/hr-on-integration-engine
        run: npm run build
